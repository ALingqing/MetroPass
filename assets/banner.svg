<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1526"/>
      <stop offset="1" stop-color="#152A46"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34E0B4"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFDFF2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F2036"/>
      <stop offset="1" stop-color="#1D4066"/>
    </linearGradient>
    <radialGradient id="tunnel" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#0C1A2E"/>
      <stop offset="0.72" stop-color="#0A1526"/>
      <stop offset="1" stop-color="#16283F"/>
    </radialGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="softShadow" x="-40%" y="-30%" width="180%" height="190%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#02060D" flood-opacity="0.5"/>
    </filter>
    <filter id="cardShadow" x="-40%" y="-30%" width="180%" height="190%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#02060D" flood-opacity="0.45"/>
    </filter>
    <clipPath id="roundB">
      <rect x="0" y="0" width="1600" height="400" rx="30"/>
    </clipPath>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="116"/>
    </clipPath>
    <clipPath id="glassClip">
      <rect x="-82" y="-92" width="164" height="84" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundB)">
    <rect x="0" y="0" width="1600" height="400" fill="url(#bg)"/>

    <!-- 背景线路图装饰 -->
    <g fill="none" stroke="#87A9D6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 900 330 L 1090 330 L 1170 250 L 1420 250" opacity="0.08"/>
      <path d="M 980 372 L 1180 372 L 1250 302 L 1560 302" opacity="0.05"/>
      <path d="M 1600 96 L 1430 96 L 1370 156 L 1370 214" opacity="0.06"/>
      <path d="M 1600 132 L 1470 132 L 1424 178" opacity="0.04"/>
    </g>
    <g fill="#87A9D6">
      <circle cx="1090" cy="330" r="6" opacity="0.16"/>
      <circle cx="1420" cy="250" r="6" opacity="0.12"/>
      <circle cx="1430" cy="96" r="6" opacity="0.13"/>
    </g>

    <!-- 图标（logo 缩小版） -->
    <g transform="translate(70,60) scale(0.55)">
      <g clip-path="url(#round)">
        <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
        <g fill="none" stroke="#87A9D6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
          <path d="M -140 424 L 96 424 L 178 342 L 372 342" opacity="0.10"/>
          <path d="M 512 96 L 404 96 L 356 144 L 356 210" opacity="0.07"/>
        </g>
        <circle cx="256" cy="238" r="150" fill="none" stroke="url(#ring)" stroke-width="14" opacity="0.55" filter="url(#glow)"/>
        <circle cx="256" cy="238" r="136" fill="url(#tunnel)"/>
        <circle cx="256" cy="238" r="136" fill="none" stroke="#081120" stroke-width="10" opacity="0.6"/>
        <circle cx="256" cy="238" r="150" fill="none" stroke="url(#ring)" stroke-width="14"/>
        <g transform="translate(256,250)">
          <g filter="url(#softShadow)">
            <rect x="-104" y="-118" width="208" height="192" rx="32" fill="url(#body)"/>
          </g>
          <rect x="-104" y="-118" width="208" height="192" rx="32" fill="url(#body)"/>
          <rect x="-104" y="-118" width="208" height="192" rx="32" fill="none" stroke="#0A1526" stroke-width="3" opacity="0.25"/>
          <rect x="-82" y="-92" width="164" height="84" rx="20" fill="url(#glass)"/>
          <g clip-path="url(#glassClip)" stroke="#9ECBF2" stroke-width="16" opacity="0.13" stroke-linecap="round">
            <line x1="-72" y1="-104" x2="-32" y2="-44"/>
            <line x1="-34" y1="-104" x2="6" y2="-44"/>
          </g>
          <rect x="-5" y="-92" width="10" height="84" fill="#0A1526" opacity="0.5"/>
          <circle cx="-66" cy="14" r="12" fill="#0E1E33" stroke="#081120" stroke-width="3"/>
          <circle cx="66" cy="14" r="12" fill="#0E1E33" stroke="#081120" stroke-width="3"/>
          <circle cx="-66" cy="14" r="13" fill="#8DEBFF" opacity="0.5" filter="url(#glow)"/>
          <circle cx="66" cy="14" r="13" fill="#8DEBFF" opacity="0.5" filter="url(#glow)"/>
          <circle cx="-66" cy="14" r="7" fill="#DDFBFF"/>
          <circle cx="66" cy="14" r="7" fill="#DDFBFF"/>
          <path d="M -104 34 L 104 34 L 104 42 Q 104 74 72 74 L -72 74 Q -104 74 -104 42 Z" fill="url(#ring)"/>
        </g>
        <g transform="translate(366,372) rotate(-10)" filter="url(#cardShadow)">
          <rect x="-96" y="-60" width="192" height="120" rx="18" fill="#FAFCFF"/>
          <line x1="-26" y1="-44" x2="-26" y2="44" stroke="#C3D3E7" stroke-width="3" stroke-dasharray="8 8"/>
          <circle cx="-26" cy="-52" r="8" fill="#0D1A2C"/>
          <circle cx="-26" cy="52" r="8" fill="#0D1A2C"/>
          <circle cx="-61" cy="-14" r="13" fill="url(#ring)"/>
          <rect x="-80" y="12" width="34" height="6" rx="3" fill="#C9D8EA"/>
          <rect x="-80" y="26" width="24" height="6" rx="3" fill="#DDE7F4"/>
          <text x="-8" y="20" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#0E1C30" text-anchor="middle">30</text>
          <text x="-8" y="42" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#7E90A9" text-anchor="middle">DAYS</text>
          <rect x="-36" y="-36" width="70" height="7" rx="3.5" fill="#D9E4F2"/>
        </g>
        <rect x="0" y="0" width="512" height="512" fill="url(#hl)"/>
      </g>
      <rect x="1" y="1" width="510" height="510" rx="115" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.07"/>
    </g>

    <!-- 标题与副标题 -->
    <text x="432" y="206" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="1" fill="#F5FAFF">MetroPass</text>
    <rect x="436" y="236" width="196" height="12" rx="6" fill="url(#ring)"/>
    <text x="436" y="300" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="30" fill="#9DB1CC">Metro 月票 / 学生票 · 一张票 30 天畅行</text>
    <text x="436" y="344" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="4" fill="#5E7590">MONTHLY &#183; STUDENT &#183; NO CORE CHANGES</text>

    <!-- 版本标签 -->
    <g>
      <rect x="1392" y="176" width="128" height="56" rx="28" fill="#FFFFFF" opacity="0.07"/>
      <rect x="1392" y="176" width="128" height="56" rx="28" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.12"/>
      <text x="1456" y="213" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#B9E6F9" text-anchor="middle">v2.0.0</text>
    </g>

    <!-- 顶部高光 -->
    <rect x="0" y="0" width="1600" height="400" fill="url(#hl)"/>
  </g>
</svg>
